name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Unit tests (risk model, importer, exam bundles, Excel)
        run: npm test

      # Our .xlsx writer has no library behind it, so a round trip through our
      # own reader proves only that the two halves agree. openpyxl is a real
      # Excel parser and is the actual check that the bytes are a workbook.
      - name: Validate the workbooks with a real Excel parser
        run: |
          python3 -m pip install --quiet openpyxl
          python3 tests/xlsx-validate.py

      # The bug that shipped three times in a row was a page that loaded no
      # JavaScript, or hung, and said nothing. A real browser catches that; a
      # Node test cannot. This needs no secrets: it serves the site locally,
      # stubs the Supabase API, and only asserts the pages actually render.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke test (every page must render)
        run: npm run test:smoke

      # The full lifecycle against the real project only runs where the
      # service-role key is available (pushes to this repo, not forks).
      - name: End-to-end API test
        if: ${{ env.SUPABASE_SERVICE_KEY != '' }}
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: npm run test:e2e

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: tests/smoke/out/
          if-no-files-found: ignore
          retention-days: 7
