name: Deploy site to GitHub Pages

on:
  push:
    branches: ["claude/secure-exam-platform-uo5ofd", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages must be switched on once by the repo owner:
      # Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
      # (The Actions token is not allowed to create the Pages site itself.)
      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Publish only what the browser needs. Tests, docs, rules and the
      # example question files are deliberately left out of the live site.
      - name: Stage the site
        run: |
          mkdir -p _site
          cp index.html exam.html professor.html setup.html _site/
          cp -r js css _site/
          echo "Deployed $(git rev-parse --short HEAD) at $(date -u +%FT%TZ)" > _site/version.txt
          ls -R _site | head -30

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
